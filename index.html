<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта настроения</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2328;--mut:#6b7280;--acc:#5b5bd6;--bd:#e3e0d8;--danger:#b3372f}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--card:#1f2127;--tx:#eceef2;--mut:#9aa1ad;--acc:#8b8bf0;--bd:#2d3037;--danger:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
header{display:flex;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--bd);background:var(--card)}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:inherit}
button{font:inherit;padding:10px 14px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.4}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:8px 12px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#map{flex:1;min-height:200px;position:relative}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mut)}
.mpin{transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:opacity .2s}
.mpin.sel{outline:3px solid var(--acc)}
.mpin.draft{background:#fff;border-style:dashed;border-color:var(--acc)}
.mpin.me,.mpin.found{width:18px;height:18px;background:#2d6cdf;font-size:0}
.mpin.found{background:#e5484d}
#sheet{max-height:46%;overflow:auto;background:var(--card);border-top:1px solid var(--bd);padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#sheet h2{font-size:18px;margin:0 0 4px}
.mut{color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:6px 0 8px}
.bar i{display:block;height:100%}
.moods{display:flex;justify-content:space-between;margin:10px 0}
.mood{font-size:28px;background:none;border:2px solid transparent;border-radius:14px;padding:4px 8px}
.mood.on{border-color:var(--acc);background:var(--bg)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.btn{width:100%;font-weight:600;margin-top:12px;padding:13px}
.del{color:var(--danger);margin-top:8px;width:100%}
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="Поиск адреса, например: Москва, Тверская 1">
  <button id="go">Найти</button>
  <button id="loc" class="ghost" aria-label="Моё местоположение">Я</button>
</header>
<div class="chips" id="chips"></div>
<div id="map"><div id="msg">Загрузка карты…</div></div>
<div id="sheet"><span class="mut">Нажмите на карту, чтобы добавить место, или выберите существующее.</span></div>

<script>
const MAP_KEY = '585f43bd-1508-4be9-ab2f-0736c802dda6'; // JavaScript API
const GEO_KEY = '34c7b8b8-2ce4-49da-985b-1102ac7a5104'; // HTTP Геокодер

const MOODS=["😞","😐","🙂","😊","🤩"];
const TAGS=["тихо","уютно","шумно","весело","суета"];
const $=id=>document.getElementById(id);
const store={
  load(){try{return JSON.parse(localStorage.getItem('moodmap_places')||'[]')}catch(e){return[]}},
  save(v){try{localStorage.setItem('moodmap_places',JSON.stringify(v))}catch(e){}}
};
let places=store.load(),map,lib,pins=new Map(),sel=null,draft=null,draftMk=null,pm=null,pt=null,filt=null,me,found;

const avg=p=>p.v.length?p.v.reduce((a,b)=>a+b,0)/p.v.length:null;
const col=a=>a==null?'#9aa1ad':`hsl(${(a-1)/4*120},70%,50%)`;
const face=a=>a==null?'•':MOODS[Math.round(a)-1];
function top(tag){let b=null,m=0;places.forEach(p=>{const n=p.t[tag]||0;if(n>m){m=n;b=p.id}});return b}
function say(t){const m=$('msg');m.textContent=t;m.style.display='flex'}
function el(cls){const d=document.createElement('div');d.className='mpin '+(cls||'');return d}

function drawChips(){
  const c=$('chips');c.textContent='';
  [["Все",null],["Хочу тишины","тихо"],["Хочу веселья","весело"]].forEach(([l,t])=>{
    const b=document.createElement('button');b.className='chip'+(filt===t?' on':'');b.textContent=l;
    b.onclick=()=>{filt=t;drawChips();refreshPins()};c.appendChild(b);
  });
}
function paint(p){
  const o=pins.get(p.id);if(!o)return;
  const a=avg(p),best=filt?top(filt):null;
  o.el.style.background=col(a);o.el.textContent=face(a);
  o.el.style.opacity=filt&&p.id!==best?0.3:1;
  o.el.classList.toggle('sel',sel===p.id);
}
function refreshPins(){places.forEach(paint)}
function addMarker(p){
  const e=el();
  e.addEventListener('click',ev=>{ev.stopPropagation();select(p.id)});
  const mk=new lib.YMapMarker({coordinates:p.c},e);
  map.addChild(mk);pins.set(p.id,{mk,el:e});paint(p);
}
function clearDraft(){if(draftMk){map.removeChild(draftMk);draftMk=null}draft=null}
function select(id){
  clearDraft();sel=id;pm=null;pt=null;refreshPins();
  const p=places.find(x=>x.id===id);if(p)map.setLocation({center:p.c,duration:300});
  drawSheet();
}
function moodButtons(){return `<div class="moods">${MOODS.map((m,i)=>`<button class="mood${pm===i+1?' on':''}" data-m="${i+1}">${m}</button>`).join('')}</div><div class="tags">${TAGS.map(t=>`<button class="chip${pt===t?' on':''}" data-t="${t}">${t}</button>`).join('')}</div>`}
function bind(s){
  s.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{pm=+b.dataset.m;keepName();drawSheet()});
  s.querySelectorAll('.tags .chip').forEach(b=>b.onclick=()=>{pt=pt===b.dataset.t?null:b.dataset.t;keepName();drawSheet()});
}
let draftName='';
function keepName(){const n=$('nm');if(n)draftName=n.value}

function drawSheet(){
  const s=$('sheet');
  if(draft){
    s.innerHTML=`<h2>Новое место</h2><input id="nm" placeholder="Название" value="${draftName.replace(/"/g,'&quot;')}"><div class="mut" style="margin-top:6px">Какая тут атмосфера?</div>${moodButtons()}<button class="btn" id="save" ${pm?'':'disabled'}>Сохранить место</button><button class="ghost del" id="cancel" style="color:var(--tx)">Отмена</button>`;
    bind(s);
    $('cancel').onclick=()=>{clearDraft();draftName='';drawSheet()};
    $('save').onclick=()=>{
      const name=$('nm').value.trim()||draft[1].toFixed(5)+', '+draft[0].toFixed(5);
      const p={id:String(Date.now()),c:draft,name,v:[pm],t:pt?{[pt]:1}:{}};
      places.push(p);store.save(places);clearDraft();draftName='';addMarker(p);select(p.id);
    };
    return;
  }
  const p=places.find(x=>x.id===sel);
  if(!p){s.innerHTML='<span class="mut">Нажмите на карту, чтобы добавить место, или выберите существующее.</span>';return}
  const a=avg(p),tags=Object.entries(p.t).sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>x[0]).join(', ');
  s.innerHTML=`<h2></h2><div class="mut">${a==null?'Пока нет отметок':`Сейчас ${face(a)} ${a.toFixed(1)} из 5 · отметок: ${p.v.length}`}</div><div class="bar"><i style="width:${a?a/5*100:0}%;background:${col(a)}"></i></div><div class="mut">Теги: ${tags||'пока нет'}</div>${moodButtons()}<button class="btn" id="go2" ${pm?'':'disabled'}>Отметить настроение</button><button class="ghost del" id="rm">Удалить место</button>`;
  s.querySelector('h2').textContent=p.name;
  bind(s);
  $('go2').onclick=()=>{p.v.push(pm);if(p.v.length>30)p.v.shift();if(pt)p.t[pt]=(p.t[pt]||0)+1;store.save(places);pm=null;pt=null;paint(p);drawSheet()};
  $('rm').onclick=()=>{map.removeChild(pins.get(p.id).mk);pins.delete(p.id);places=places.filter(x=>x.id!==p.id);store.save(places);sel=null;drawSheet()};
}

function startDraft(c,name){
  sel=null;refreshPins();clearDraft();pm=null;pt=null;
  draft=c;draftName=name||'';
  draftMk=new lib.YMapMarker({coordinates:c},el('draft'));map.addChild(draftMk);
  drawSheet();
}

async function geocode(text){
  const url='https://geocode-maps.yandex.ru/v1/?format=json&results=1&lang=ru_RU&apikey='+encodeURIComponent(GEO_KEY)+'&geocode='+encodeURIComponent(text);
  const r=await fetch(url);
  if(!r.ok)throw new Error('Геокодер вернул ошибку '+r.status+'. Проверьте, что в ключе включён HTTP Геокодер.');
  const j=await r.json(),m=j.response.GeoObjectCollection.featureMember[0];
  if(!m)return null;
  const [lon,lat]=m.GeoObject.Point.pos.split(' ').map(Number);
  return {c:[lon,lat],name:m.GeoObject.metaDataProperty.GeocoderMetaData.text};
}
async function search(){
  const t=$('q').value.trim();if(!t)return;
  try{
    const r=await geocode(t);
    if(!r)return alert('Ничего не найдено. Уточните адрес.');
    map.setLocation({center:r.c,zoom:16,duration:400});
    if(found)map.removeChild(found);
    found=new lib.YMapMarker({coordinates:r.c},el('found'));map.addChild(found);
    startDraft(r.c,r.name);
  }catch(e){alert(e.message)}
}
function locate(){
  if(!navigator.geolocation)return alert('Геолокация недоступна в этом браузере.');
  navigator.geolocation.getCurrentPosition(pos=>{
    const c=[pos.coords.longitude,pos.coords.latitude];
    if(me)map.removeChild(me);
    me=new lib.YMapMarker({coordinates:c},el('me'));map.addChild(me);
    map.setLocation({center:c,zoom:15,duration:400});
  },()=>alert('Не удалось определить местоположение. Разрешите доступ в настройках браузера.'));
}

async function init(){
  await ymaps3.ready;lib=ymaps3;
  const {YMap,YMapDefaultSchemeLayer,YMapDefaultFeaturesLayer,YMapListener}=lib;
  $('msg').style.display='none';
  map=new YMap($('map'),{location:{center:places.length?places[0].c:[37.618,55.751],zoom:places.length?13:10}});
  map.addChild(new YMapDefaultSchemeLayer());
  map.addChild(new YMapDefaultFeaturesLayer());
  map.addChild(new YMapListener({layer:'any',onClick:(obj,ev)=>{if(!obj&&ev&&ev.coordinates)startDraft(ev.coordinates)}}));
  places.forEach(addMarker);
}

$('go').onclick=search;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('loc').onclick=()=>map?locate():null;
drawChips();
say('Версия 2 · ключ '+MAP_KEY.slice(0,8)+' · загрузка карты…');
window.addEventListener('error',e=>say('Ошибка: '+(e.message||'скрипт не загрузился')+' · ключ '+MAP_KEY.slice(0,8)));
setTimeout(()=>{if(!map)say('Карта не ответила за 10 секунд. Ключ '+MAP_KEY.slice(0,8)+'. ymaps3 '+(typeof ymaps3==='undefined'?'не загружен':'загружен')+'. Домен: '+location.hostname)},10000);
const s=document.createElement('script');
s.src='https://api-maps.yandex.ru/v3/?apikey='+encodeURIComponent(MAP_KEY)+'&lang=ru_RU';
s.onload=()=>init().catch(e=>say('Ошибка карты: '+e.message));
s.onerror=()=>say('Не удалось загрузить Яндекс Карты. Проверьте интернет и ключ.');
document.head.appendChild(s);
</script>
</body>
</html>
