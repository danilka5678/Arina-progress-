<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта настроения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#030812;--tx:#e8f6ff;--mut:#86b9ea;--acc:#0ECCED;--bd:rgba(14,204,237,.26);--danger:#ff7a7a;--tile:rgba(4,55,128,.55);--cond:"Oswald","Bebas Neue","Arial Narrow","Avenir Next Condensed",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1);
--gloss:linear-gradient(145deg,rgba(14,204,237,.26),rgba(4,55,128,.42) 42%,rgba(2,7,100,.48));--cta:linear-gradient(135deg,#0ECCED,#4db8ff 55%,#0ECCED)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.4 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
#mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mut);background:radial-gradient(80% 50% at 50% 0%,rgba(2,94,196,.5),transparent 70%),var(--bg);z-index:3}
#top{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
#top>*{pointer-events:auto}
header{position:relative;overflow:hidden;display:flex;gap:6px;padding:6px;border-radius:24px;background:linear-gradient(120deg,rgba(2,7,100,.5),rgba(3,8,18,.42));-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--bd);box-shadow:0 0 26px rgba(2,94,196,.45),inset 0 1px 0 rgba(255,255,255,.12)}
header::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(14,204,237,.22) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 7s ease-in-out infinite;pointer-events:none;will-change:transform}
@keyframes sweep{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
input{flex:1;min-width:0;font:inherit;padding:10px 14px;border:1px solid var(--bd);border-radius:16px;background:transparent;color:inherit}
input::placeholder,textarea::placeholder{color:var(--mut)}
header input{border:0;position:relative;z-index:1}
button{font-family:var(--cond);font-size:16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:10px 16px;border:0;border-radius:16px;background:var(--cta);color:#030812;cursor:pointer;transition:transform .2s var(--ease),box-shadow .25s,opacity .2s;position:relative;z-index:1}
button:active{transform:scale(.95)}
button.ghost{background:var(--gloss);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
button:disabled{opacity:.4}
#chips{display:flex;align-items:center;gap:8px;overflow-x:auto;height:76px;margin:6px -12px 0;padding:6px 12px 10px;pointer-events:none;scrollbar-width:none;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent)}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;border:1px solid var(--bd);background:linear-gradient(145deg,rgba(14,204,237,.24),rgba(3,8,18,.55) 58%);background-clip:padding-box;color:var(--tx);border-radius:999px;padding:8px 15px;font-size:15px;box-shadow:0 0 16px rgba(2,94,196,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.chip.on{background:var(--cta);color:#030812;border-color:transparent}
.chip.hide{display:none!important}
.chip.opt{animation:slideIn .55s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes slideIn{from{opacity:0;transform:translateX(-22px) scale(.9)}to{opacity:1;transform:none}}
.chev{display:inline-block;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid currentColor;margin-left:9px;transition:transform .45s var(--ease)}
.chev.open{transform:rotate(180deg)}
.tags .chip{background:var(--gloss);background-clip:padding-box;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.tags .chip.on{background:var(--cta)}
.mpin{width:0;height:0;position:relative;transition:opacity .25s;animation:pin .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pin{from{transform:scale(0)}to{transform:scale(1)}}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);transform:translate(-50%,-50%);background:var(--acc);position:relative}
.dot.me::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:rgba(14,204,237,.3);animation:halo 2s infinite}
@keyframes halo{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.dot.found{background:#ff4d6d}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;max-height:62vh;border-radius:28px 28px 0 0;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(4,55,128,.58) 0%,rgba(2,7,100,.52) 40%,rgba(3,8,18,.78) 100%);-webkit-backdrop-filter:blur(18px) saturate(1.35);backdrop-filter:blur(18px) saturate(1.35);box-shadow:0 -8px 34px rgba(2,94,196,.45),inset 0 1px 0 rgba(255,255,255,.25);transform:translateY(0);transition:transform .55s var(--ease);will-change:transform}
#sheet.collapsed{transform:translateY(var(--off,0px))}
#sheet.drag{transition:none}
#sheet::after{content:"";position:absolute;left:0;right:0;top:100%;height:260px;background:rgba(3,8,18,.8)}
#sheen{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
#sheen::before{content:"";position:absolute;inset:-30%;background:radial-gradient(38% 36% at 28% 18%,rgba(14,204,237,.38),transparent 70%),radial-gradient(40% 40% at 82% 52%,rgba(2,94,196,.55),transparent 70%);animation:drift 12s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{from{transform:translate3d(-8%,-4%,0) rotate(0)}to{transform:translate3d(8%,6%,0) rotate(8deg)}}
#grab,#sheetbody,#ymlink{position:relative;z-index:1}
#grab{flex:0 0 auto;padding:12px 0 14px;cursor:pointer;touch-action:none}
#grab i{display:block;width:48px;height:5px;border-radius:3px;background:linear-gradient(90deg,rgba(14,204,237,.3),rgba(14,204,237,.9),rgba(14,204,237,.3));margin:0 auto}
#sheetbody{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 4px 20px;margin:-6px -4px 0;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 16px,#000 calc(100% - 22px),transparent 100%);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#ymlink{position:absolute;left:12px;top:-58px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--acc);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);background:var(--gloss);background-clip:padding-box;border:1px solid var(--bd);box-shadow:0 0 18px rgba(2,94,196,.65),inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer;user-select:none}
#sheet h2{font-family:var(--cond);font-size:28px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:0 0 4px}
.hint{background:var(--gloss);color:var(--tx);padding:14px 16px;border-radius:18px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.mut{color:var(--mut);font-size:13px}
.bar{height:10px;border-radius:5px;background:rgba(14,204,237,.15);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:5px}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.mood{font-size:30px;line-height:1;padding:12px 0;border:0;border-radius:18px;background:var(--gloss);background-clip:padding-box;color:inherit;text-transform:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);transition:transform .3s var(--ease),box-shadow .3s}
.mood.on{transform:scale(1.04);box-shadow:0 0 0 2px var(--acc),0 0 18px rgba(14,204,237,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
textarea{display:block;width:100%;min-height:88px;margin-top:12px;font:inherit;padding:12px 14px;border:1px solid var(--bd);border-radius:16px;background:var(--gloss);background-clip:padding-box;color:inherit;resize:none;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
textarea:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(14,204,237,.35)}
.rev{font-size:14px;margin-top:6px;padding:8px 10px;border-radius:12px;background:var(--gloss)}
.btn{width:100%;margin-top:12px;padding:14px;border-radius:18px;font-size:19px}
.del{color:var(--danger);margin-top:8px;width:100%;background:transparent}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
#loc{padding:0;width:46px;display:flex;align-items:center;justify-content:center;color:var(--acc)}
svg.ic{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip.emo{width:56px;height:56px;padding:0;display:flex;align-items:center;justify-content:center;font-size:29px;line-height:1;text-transform:none;border-radius:18px;border:0;background:linear-gradient(145deg,rgba(14,204,237,.38),rgba(4,55,128,.86) 45%,rgba(2,7,100,.92));background-clip:padding-box;box-shadow:0 0 14px rgba(2,94,196,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.chip.emo.on{background:linear-gradient(145deg,rgba(14,204,237,.5),rgba(4,55,128,.86) 45%,rgba(2,7,100,.92));color:inherit;box-shadow:0 0 0 2px var(--acc),0 0 18px rgba(14,204,237,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.infbox{background:var(--gloss);border-radius:16px;padding:10px 12px;margin-bottom:10px;font-size:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.infbox[hidden]{display:none}
.infbox .row{margin:3px 0}
.infbox a{color:var(--acc);font-weight:600}
#chips>*{pointer-events:auto}
#chips button:active{transform:none}
#chips .chip{transition:box-shadow .3s,background .3s}


#hdr{position:relative}
#sug{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;overflow:auto;border-radius:22px;background:linear-gradient(160deg,rgba(4,55,128,.8),rgba(2,7,100,.82));-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--bd);box-shadow:0 10px 34px rgba(0,0,0,.5),0 0 26px rgba(2,94,196,.4);padding:6px;animation:rise .3s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#sug[hidden]{display:none}
#sug .gl{font-family:var(--cond);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:8px 10px 4px}

.qw{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.qw input{padding-right:36px}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
#qx{position:absolute;right:4px;top:50%;margin-top:-14px;width:28px;height:28px;padding:0;border-radius:50%;background:rgba(14,204,237,.22);color:var(--tx);font-size:19px;line-height:1;z-index:2;letter-spacing:0}
#qx[hidden]{display:none}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 6px 10px}
.hgrid button{padding:10px 4px;border-radius:14px;background:var(--gloss);color:var(--tx);font-size:17px;letter-spacing:.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.hgrid .all{grid-column:1/-1;background:var(--cta);color:#030812}

.pb{position:absolute;left:0;top:0;width:0;height:0;cursor:pointer}
.pb::after{content:"";position:absolute;left:-24px;top:-56px;width:48px;height:60px}
.pb .ps{position:absolute;left:-16px;top:-52px;overflow:visible;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.pb .f{position:absolute;left:9px;top:-52px;width:20px;height:20px;border-radius:50%;background:rgba(3,8,18,.92);border:1.5px solid #fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.pb .ring{position:absolute;left:-11px;top:-5px;width:22px;height:10px;border-radius:50%;border:1.5px solid var(--acc);box-shadow:0 0 6px var(--acc);opacity:0;pointer-events:none}
.pb.sel .ring,.pb.draft .ring{animation:ground 1.8s ease-out infinite}
.pb.sel .ring.b,.pb.draft .ring.b{animation-delay:.9s}
@keyframes ground{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2);opacity:0}}
.pb.draft .f{display:none}
.pb.draft .ps{animation:hop 1.1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#sug .it{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;font-family:inherit;text-transform:none;letter-spacing:0;font-weight:500;background:transparent;color:var(--tx);padding:8px 8px;border-radius:16px;line-height:1.25}
#sug .it:active{background:var(--gloss);transform:none}
#sug .ic2{width:44px;height:44px;border-radius:14px;background:rgba(134,185,234,.2);display:flex;align-items:center;justify-content:center;color:var(--acc)}
#sug .ic2.m{background:#1f6fe0;color:#fff;border-radius:50%}
#sug .ic2 svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sug .tx{min-width:0}
#sug .t{font-size:16px;font-weight:500;overflow-wrap:anywhere}
#sug .t b{font-weight:800}
#sug .s{font-size:13px;color:var(--mut);margin-top:2px}
#sug .ds{align-self:start;font-size:13px;color:var(--mut);white-space:nowrap;padding-top:2px}
#sug .ic2{position:relative}
#sug .ck{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:#6b7080;border:2px solid #0b1250;display:flex;align-items:center;justify-content:center}
#sug .ck svg{width:11px;height:11px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
#sug .ic2.org-food{background:#c4572e;color:#fff;border-radius:50%}
#sug .ic2.org-health{background:#c0505a;color:#fff;border-radius:50%}
#sug .ic2.org-shop{background:#1f6fe0;color:#fff;border-radius:50%}
#sug .ic2.org-other{background:#5b6ad0;color:#fff;border-radius:50%}
</style>
</head>
<body>
<div id="mapwrap">
  <div id="map"><div id="msg">Загрузка карты…</div></div>
  <div id="top">
    <div id="hdr"><header>
      <div class="qw"><input id="q" type="search" placeholder="Поиск адреса" autocomplete="off"><button id="qx" hidden aria-label="Очистить">×</button></div>
      <button id="go">Найти</button>
      <button id="loc" class="ghost" aria-label="Моё местоположение"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg></button>
    </header><div id="sug" hidden></div></div>
    <div class="chips" id="chips"></div>
  </div>
</div>
<div id="sheet"><div id="sheen"></div><a id="ymlink" role="button" aria-label="Открыть в Яндекс Картах"><svg class="ic" viewBox="0 0 24 24"><path d="M20.5 3.5L3.5 10.2l6.6 3.2 3.2 6.6z"/></svg></a><div id="grab" role="button" aria-label="Свернуть или развернуть"><i></i></div><div id="sheetbody"><div class="hint">👆 Нажмите на карту или на заведение, чтобы отметить место</div></div></div>

<script>
const MAP_KEY = '585f43bd-1508-4be9-ab2f-0736c802dda6'; // JavaScript API
const GEO_KEY = '34c7b8b8-2ce4-49da-985b-1102ac7a5104'; // HTTP Геокодер

const MOODS=["😭","😞","😐","🙂","😊","😄","😍","🤩"];
const TAGS=["тихо","уютно","шумно","весело","суета","романтично","для работы"];
const $=id=>document.getElementById(id);
const store={
  load(){try{return JSON.parse(localStorage.getItem('moodmap_places')||'[]')}catch(e){return[]}},
  save(v){try{localStorage.setItem('moodmap_places',JSON.stringify(v))}catch(e){}}
};
let places=store.load(),map,lib,pins=new Map(),sel=null,draft=null,draftMk=null,pm=null,pt=null,filt=null,moodFilter=null,me,found,reviewText='';
places.forEach(p=>{if(!p.s){p.v=p.v.map(x=>Math.round((x-1)/4*7+1));p.s=8}if(!p.r)p.r=[]});store.save(places);

const avg=p=>p.v.length?p.v.reduce((a,b)=>a+b,0)/p.v.length:null;
const col=a=>a==null?'#9aa1ad':`hsl(${(a-1)/(MOODS.length-1)*120},70%,50%)`;
const face=a=>a==null?'•':MOODS[Math.round(a)-1];
function bestFor(tag){let b=null,m=0;places.forEach(p=>{const n=p.t[tag]||0;if(n>m){m=n;b=p.id}});return b}
function say(t){const m=$('msg');m.textContent=t;m.style.display='flex'}
let pinN=0;
function pinSvg(id){return '<svg class="ps" viewBox="0 0 32 52" width="32" height="52"><defs><radialGradient id="'+id+'" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="#ff8f8f"/><stop offset=".55" stop-color="#e23b3b"/><stop offset="1" stop-color="#8f1218"/></radialGradient><linearGradient id="ndl" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#f6f8fb"/><stop offset=".5" stop-color="#a3abbb"/><stop offset="1" stop-color="#6b7284"/></linearGradient></defs><polygon points="13.3,27 18.7,27 16,52" fill="url(#ndl)" stroke="#7b8394" stroke-width=".5" stroke-linejoin="miter"/><ellipse cx="16" cy="28" rx="7.2" ry="2.6" fill="#59606f"/><circle cx="16" cy="16" r="13.5" fill="url(#'+id+')"/><ellipse cx="10.6" cy="9.6" rx="5" ry="3.2" transform="rotate(-35 10.6 9.6)" fill="#fff" opacity=".7"/><circle cx="8.8" cy="8.2" r="1.4" fill="#fff"/></svg>'}
function pin(cls){const o=document.createElement('div');o.className='mpin';const b=document.createElement('div');b.className='pb '+(cls||'');b.innerHTML='<span class="ring"></span><span class="ring b"></span>'+pinSvg('pg'+(++pinN));const f=document.createElement('span');f.className='f';b.appendChild(f);o.appendChild(b);o.pb=b;o.f=f;o.stops=[...b.querySelectorAll('radialGradient stop')];return o}
function setPinHue(o,h){
  const c=h==null?['#d4d9e2','#8f98a8','#4c5362']:['hsl('+h+',92%,70%)','hsl('+h+',80%,50%)','hsl('+h+',86%,27%)'];
  o.stops.forEach((st,k)=>st.setAttribute('stop-color',c[k]));
}
function dot(cls){const d=document.createElement('div');d.className='dot '+(cls||'');return d}

function passMood(p){if(moodFilter==null)return true;const a=avg(p);return a!=null&&Math.round(a)===moodFilter}
const OPTS=MOODS.map((m,i)=>[m,i+1,'Настроение '+(i+1)+' из '+MOODS.length]);
let chipsOpen=false,chipEls=null;
function drawChips(){
  const c=$('chips');
  if(!chipEls){
    const all=document.createElement('button');all.className='chip on';
    all.appendChild(document.createTextNode('Все'));
    const ch=document.createElement('span');ch.className='chev';all.appendChild(ch);
    all.onclick=()=>{chipsOpen=!chipsOpen;if(chipsOpen&&c.scrollLeft>0)c.scrollTo({left:0,behavior:'smooth'});drawChips()};
    c.appendChild(all);
    chipEls={all,ch,opts:OPTS.map(([e,t,l])=>{
      const b=document.createElement('button');b.className='chip opt emo hide';b.textContent=e;b.title=l;b.setAttribute('aria-label',l);
      b.onclick=()=>{moodFilter=moodFilter===t?null:t;drawChips();refreshPins()};
      c.appendChild(b);return [b,t]})};
  }
  chipEls.all.classList.toggle('on',moodFilter==null);
  chipEls.ch.classList.toggle('open',chipsOpen);
  chipEls.opts.forEach(([b,t],i)=>{
    const show=chipsOpen||moodFilter===t;
    b.classList.toggle('hide',!show);
    b.classList.toggle('on',moodFilter===t);
    b.style.setProperty('--i',chipsOpen?i:0);
  });
}
function paint(p){
  const o=pins.get(p.id);if(!o)return;
  const a=avg(p),best=filt?bestFor(filt):null;
  setPinHue(o.el,a==null?null:(a-1)/(MOODS.length-1)*120);o.el.f.textContent=a==null?'':face(a);o.el.f.style.display=a==null?'none':'flex';
  o.el.style.opacity=filt&&!(p.t&&p.t[filt])?0.22:1;
  o.el.style.visibility=passMood(p)?'visible':'hidden';
  o.el.pb.classList.toggle('sel',sel===p.id);
}
function refreshPins(){places.forEach(paint)}
function addMarker(p){
  const e=pin();
  e.addEventListener('click',ev=>{ev.stopPropagation();select(p.id)});
  const mk=new lib.YMapMarker({coordinates:p.c},e);
  map.addChild(mk);pins.set(p.id,{mk,el:e});paint(p);
}

    if(TR2[two]){lat+='('+TR2[two]+')';cyr+=(()=>{const c=clean[i+1];return '['+c+c.toUpperCase()+']'})();i++;continue}
    if(ch===' '||ch==='-')lat+='[ -]?';
    else if(ch==='ь'||ch==='ъ')lat+='';
    else if(TR[ch])lat+='('+TR[ch]+')';
    else lat+=ch;
  }
  return {cyr,lat};
}
async function orgSearch(text){
  const c=myPos||lastC;orgNote='';if(!c)return[];
  const cat=catFor(text);
  let out=[],ymErr='';
  try{
    if(lib&&lib.search){
      const r=await lib.search({text:cat?cat.k[0]:text,bounds:[[c[0]-.1,c[1]-.07],[c[0]+.1,c[1]+.07]],limit:15});
      (Array.isArray(r)?r:(r&&r.features)||[]).forEach(f=>{
        const g=f.geometry&&f.geometry.coordinates,pr=f.properties||{},cm=pr.CompanyMetaData||{};
        if(!g||!pr.name)return;
        const cats=(cm.Categories||[]).map(x=>x&&x.name).filter(Boolean).slice(0,2).join(', ');
        const addr=pr.description||'';
        out.push({c:g,title:pr.name,addr,sub:[cats,addr].filter(Boolean).join(' · '),full:pr.name+(addr?', '+addr:''),kind:'org',g:cat?cat.g:'other',local:true,d:distM(c,g)});
      });
      if(!out.length)ymErr='пусто';
    }else ymErr='недоступен';
  }catch(e){ymErr=String(e&&e.message||e).slice(0,50)}
  let osmErr='';
  if(!out.length){
    const ar='(around:'+(cat?5000:15000)+','+c[1]+','+c[0]+')';
    let q;
    if(cat)q='[out:json][timeout:9];nwr'+cat.q+'["name"]'+ar+';out center 40;';
    else{
      const n=nameRx(text),P='('+n.cyr+'|'+n.lat+')';
      q='[out:json][timeout:9];(';
      ['amenity','shop','tourism','leisure'].forEach(k=>{q+='nwr["name"~"'+P+'",i]["'+k+'"]'+ar+';'});
      ['amenity','shop'].forEach(k=>{q+='nwr["name:en"~"'+P+'",i]["'+k+'"]'+ar+';'});
      q+=');out center 30;';
    }
    const res=await overpass(q);osmErr=res.err;
    res.els.forEach(e=>{
      const tg=e.tags||{},ll=e.center?[e.center.lon,e.center.lat]:[e.lon,e.lat];
      if(!tg.name||!ll[0])return;
      const kind=tg.amenity||tg.shop||tg.tourism||tg.leisure||'',addr=[tg['addr:street'],tg['addr:housenumber']].filter(Boolean).join(', ');
      out.push({c:ll,title:tg.name,addr,sub:[OSM_RU[kind]||'',addr].filter(Boolean).join(' · '),full:tg.name+(addr?', '+addr:''),kind:'org',g:osmGroup(tg),local:true,d:distM(c,ll)});
    });
    if(!out.length)orgNote='Заведения не найдены (Яндекс: '+ymErr+'; OSM: '+(osmErr||'пусто')+')';
  }
  const seen=new Set();
  return out.filter(x=>{const k=x.title+'|'+x.c.map(v=>v.toFixed(4)).join();if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.d-b.d).slice(0,10);
}
async function houseVariants(streetText,num){
  const c=myPos||lastC||[37.618,55.751],box='&ll='+c[0]+','+c[1]+'&spn=0.6,0.4';
  const sts=await geoQuery(streetText,box+'&rspn=1',5);
  const st=sts.find(x=>x.kind==='street');if(!st)return[];
  const hs=await houseList(st),n=num.toLowerCase();
  return hs.filter(h=>h.n.toLowerCase().startsWith(n)).slice(0,10).map(h=>{h.it.d=distM(c,h.it.c);h.it.local=true;return h.it});
}
async function suggestAll(t){
  const m=t.match(/^(.*\D)[,\s]+(\d[0-9А-Яа-яA-Za-z\/\-]*)$/);
  let extra=[];
  if(m&&m[1].trim().length>=3){try{extra=await houseVariants(m[1].trim(),m[2])}catch(e){}}
  const base=await suggest(t),seen=new Set(extra.map(x=>x.full));
  return extra.concat(base.filter(x=>!seen.has(x.full)));
}
let streetCtx=null;
async function pickStreet(it){
  const q=$('q');q.value=it.full+', ';syncX();lastQ=q.value;
  streetCtx={it,houses:[],loading:true};
  q.focus();try{q.setSelectionRange(q.value.length,q.value.length)}catch(e){}
  renderHouses();
  const ctx=streetCtx;
  try{ctx.houses=await houseList(it)}catch(e){ctx.houses=[]}
  ctx.loading=false;
  if(streetCtx===ctx)renderHouses();
}
function renderHouses(){
  const ctx=streetCtx;if(!ctx)return;
  const b=$('sug'),t=$('q').value.trim(),rest=t.slice(ctx.it.full.length+1).trim();
  b.textContent='';
  const g=document.createElement('div');g.className='gl';
  g.textContent=ctx.loading?'Ищу номера домов…':'Номер дома · '+ctx.it.title;b.appendChild(g);
  if(!ctx.loading){
    const hs=rest?ctx.houses.filter(h=>h.n.toLowerCase().startsWith(rest.toLowerCase())):ctx.houses;
    const grid=document.createElement('div');grid.className='hgrid';
    const all=document.createElement('button');all.className='all';all.textContent='Вся улица';all.onclick=()=>goTo(ctx.it);grid.appendChild(all);
    hs.slice(0,80).forEach(h=>{const x=document.createElement('button');x.textContent=h.n;x.onclick=()=>goTo(h.it);grid.appendChild(x)});
    b.appendChild(grid);
    const n=document.createElement('div');n.className='gl';
    n.textContent=hs.length?'Или впишите номер и нажмите «Найти»':'Такого номера в списке нет — нажмите «Найти»';b.appendChild(n);
  }
  b.hidden=false;fitSug();
}
function goTo(it){
  hideSug();$('q').blur();streetCtx=null;
  addHist(it);
  $('q').value=it.full;syncX();
  map.setLocation({center:it.c,zoom:17,duration:500});
  if(found)map.removeChild(found);
  found=new lib.YMapMarker({coordinates:it.c},dot('found'));map.addChild(found);
  startDraft(it.c,it.title,it.kind==='org'?(it.addr||'Определяю адрес…'):it.full);
  if(it.kind==='org'&&!it.addr){const c0=it.c;revGeocode(c0).then(r=>{if(draft===c0&&r){draftAddr=r.full;drawSheet()}}).catch(()=>{})}
}
const CLOCK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
function showSug(list,label,foot){
  const b=$('sug');b.textContent='';
  if(label){const g=document.createElement('div');g.className='gl';g.textContent=label;b.appendChild(g)}
  const hasOther=list.some(x=>!x.local);
  let sepDone=false;
  list.forEach(it=>{
    if(hasOther&&!it.local&&!sepDone){sepDone=true;const g=document.createElement('div');g.className='gl';g.textContent='В других городах';b.appendChild(g)}
    const t=document.createElement('button');t.className='it';
    const ic=document.createElement('div');ic.className='ic2'+(it.kind==='metro'?' m':'')+(it.kind==='org'?' org-'+(it.g||'other'):'');
    ic.innerHTML=(it.kind==='org'?(ORG_ICON[it.g]||ORG_ICON.other):(KIND_ICON[it.kind]||KIND_ICON.place))+(it.hist?'<i class="ck">'+CLOCK+'</i>':'');t.appendChild(ic);
    const tx=document.createElement('div');tx.className='tx';
    const tt=document.createElement('div');tt.className='t';hl(tt,it.title,lastQ);tx.appendChild(tt);
    const lab=(it.kind==='house'||it.kind==='street')?'':(KIND_LABEL[it.kind]||'');
    const sub=(it.kind==='org'?it.sub:[lab,it.sub].filter(Boolean).join(' · '))+(it.kind==='street'?((lab||it.sub)?' · ':'')+'номера домов':'');
    if(sub){const sd=document.createElement('div');sd.className='s';sd.textContent=sub;tx.appendChild(sd)}
    t.appendChild(tx);
    const ds=document.createElement('div');ds.className='ds';ds.textContent=it.d!=null?fmtD(it.d):'';t.appendChild(ds);
    t.onclick=()=>it.kind==='street'?pickStreet(it):goTo(it);
    b.appendChild(t);
  });
  if(foot){const g=document.createElement('div');g.className='gl';g.style.textTransform='none';g.style.letterSpacing='0';g.style.fontFamily='inherit';g.textContent=foot;b.appendChild(g)}
  b.hidden=!list.length&&!label&&!foot;
  fitSug();
}
let sugTimer=null,sugSeq=0;
function onType(){
  syncX();
  const t=$('q').value.trim();lastQ=t;
  clearTimeout(sugTimer);
  if(streetCtx&&t.startsWith(streetCtx.it.full+',')){renderHouses();return}
  streetCtx=null;
  if(!t){const h=histItems('');if(h.length)showSug(h,'Часто ищете');else hideSug();return}
  const my=++sugSeq;
  if(t.length<2){const h=histItems(t);if(h.length)showSug(h);else hideSug();return}
  const h0=histItems(t);if(h0.length)showSug(h0);
  sugTimer=setTimeout(async()=>{
    let addr=[];
    try{addr=await suggestAll(t)}catch(e){}
    if(my!==sugSeq)return;
    const hist=histItems(t),seenH=new Set(hist.map(x=>x.full));
    const base=hist.concat(addr.filter(x=>!seenH.has(x.full)));
    showSug(base);
    if(t.length>=3){
      let orgs=[];try{orgs=await orgSearch(t)}catch(e){}
      if(my!==sugSeq)return;
      if(!orgs.length){if(orgNote)showSug(base,null,orgNote);return}
      showSug(catFor(t)?orgs.concat(base):base.slice(0,5).concat(orgs.slice(0,5),base.slice(5)));
    }
  },t.length<3?140:260);
}
async function search(){
  const t=$('q').value.trim();if(!t)return;
  if(streetCtx&&t.startsWith(streetCtx.it.full+',')){
    const rest=t.slice(streetCtx.it.full.length+1).trim();
    if(!rest){goTo(streetCtx.it);return}
    const ex=streetCtx.houses.find(h=>h.n.toLowerCase()===rest.toLowerCase());
    if(ex){goTo(ex.it);return}
  }
  try{
    if(catFor(t)){
      const orgs=await orgSearch(t);
      if(!orgs.length)return alert('Рядом ничего не найдено. '+orgNote);
      showSug(orgs);$('q').blur();return;
    }
    const list=await suggestAll(t);
    if(!list.length)return alert('Ничего не найдено. Уточните запрос.');
    const first=(/\d/.test(t)?list[0]:list.find(x=>x.kind!=='house'))||list[0];
    first.kind==='street'?pickStreet(first):goTo(first);
  }catch(e){alert(e.message)}
}
function locate(){
  if(!navigator.geolocation)return alert('Геолокация недоступна в этом браузере.');
  navigator.geolocation.getCurrentPosition(pos=>{
    const c=[pos.coords.longitude,pos.coords.latitude];
    setMe(c);
    map.setLocation({center:c,zoom:15,duration:400});
  },()=>alert('Не удалось определить местоположение. Разрешите доступ в настройках браузера.'));
}

function getPos(){return new Promise(res=>{
  if(!navigator.geolocation)return res(null);
  let done=false;const fin=v=>{if(!done){done=true;res(v)}};
  setTimeout(()=>fin(null),7000);
  navigator.geolocation.getCurrentPosition(p=>fin([p.coords.longitude,p.coords.latitude]),()=>fin(null),{enableHighAccuracy:true,timeout:7000,maximumAge:60000});
})}
function setMe(c){
  myPos=c;
  if(me)map.removeChild(me);
  me=new lib.YMapMarker({coordinates:c},dot('me'));map.addChild(me);
  try{localStorage.setItem('moodmap_last',JSON.stringify(c))}catch(e){}
}
function styleOpenBtn(){
  const LAB='Открыть Яндекс Карты';
  const fix=()=>{
    const root=$('map');
    const leaf=[...root.querySelectorAll('*')].find(n=>!n.children.length&&n.textContent.trim()===LAB&&!n.dataset.fixed);
    if(!leaf)return;
    leaf.dataset.fixed='1';
    let top=leaf;
    while(top.parentElement&&top.parentElement!==root){
      const r=top.parentElement.getBoundingClientRect();
      if(r.width>260||r.height>120)break;
      top=top.parentElement;
    }
    top.style.display='none';
  };
  new MutationObserver(fix).observe($('map'),{childList:true,subtree:true});
  fix();
}
async function init(){
  await ymaps3.ready;lib=ymaps3;
  const {YMap,YMapDefaultSchemeLayer,YMapDefaultFeaturesLayer,YMapListener}=lib;
  say('Определяю, где вы находитесь…');
  const pos=await getPos();
  let last=null;try{last=JSON.parse(localStorage.getItem('moodmap_last')||'null')}catch(e){}
  const start=pos||last||(places.length?places[0].c:[37.618,55.751]);
  $('msg').style.display='none';
  lastC=start;
  const loc0={center:start,zoom:(pos||last||places.length)?15:10};
  try{map=new YMap($('map'),{location:loc0,margin:[0,0,44,0]})}catch(e){map=new YMap($('map'),{location:loc0})}
  const dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  map.addChild(new YMapDefaultSchemeLayer({theme:'dark'}));
  map.addChild(new YMapDefaultFeaturesLayer());
  if(pos)setMe(pos);
  styleOpenBtn();
  map.addChild(new YMapListener({layer:'any',onUpdate:({location})=>{if(location&&location.center){lastC=location.center;lastZ=location.zoom}},onClick:(obj,ev)=>{if(obj&&obj.type==='marker')return;if(ev&&ev.coordinates)tapPlace(ev.coordinates,obj)}}));
  places.forEach(addMarker);
}

let sugBusy=false;
$('sug').addEventListener('touchstart',()=>{sugBusy=true;setTimeout(()=>{sugBusy=false},700)},{passive:true});
$('sug').addEventListener('mousedown',()=>{sugBusy=true;setTimeout(()=>{sugBusy=false},700)});
$('q').addEventListener('blur',()=>setTimeout(()=>{if(!sugBusy&&document.activeElement!==$('q'))hideSug()},250));

$('q').addEventListener('focus',onType);
document.addEventListener('click',e=>{if(!$('hdr').contains(e.target))hideSug()});
$('loc').onclick=()=>map?locate():null;
function setCollapsed(v){
  const sh=$('sheet');
  if(v)sh.style.setProperty('--off',(sh.offsetHeight-$('grab').offsetHeight-4)+'px');
  sh.classList.toggle('collapsed',v);
}
$('grab').onclick=()=>setCollapsed(!$('sheet').classList.contains('collapsed'));
(function(){
  const sh=$('sheet'),g=$('grab');let y0=null,off=0,start=0,v=0,moved=false;
  g.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;moved=false;off=sh.offsetHeight-g.offsetHeight-4;start=sh.classList.contains('collapsed')?off:0;sh.style.setProperty('--off',off+'px')},{passive:true});
  g.addEventListener('touchmove',e=>{if(y0==null)return;const d=e.touches[0].clientY-y0;if(!moved&&Math.abs(d)<6)return;moved=true;sh.classList.add('drag');v=Math.min(off,Math.max(0,start+d));sh.style.transform='translateY('+v+'px)';e.preventDefault()},{passive:false});
  g.addEventListener('touchend',e=>{if(y0==null)return;const was=moved;y0=null;if(!was)return;sh.classList.remove('drag');sh.style.transform='';setCollapsed(v>off*0.4);e.preventDefault()});
  const b=$('sheetbody');let by=null;
  b.addEventListener('touchstart',e=>{by=b.scrollTop>0?null:e.touches[0].clientY},{passive:true});
  b.addEventListener('touchend',e=>{if(by==null)return;const d=e.changedTouches[0].clientY-by;by=null;if(d>80)setCollapsed(true)});
  if(window.visualViewport){
    const vv=visualViewport,f=()=>{const kb=Math.max(0,innerHeight-vv.height-vv.offsetTop);sh.style.bottom=kb+'px';sh.style.maxHeight=Math.round(vv.height*0.64)+'px'};
    vv.addEventListener('resize',f);vv.addEventListener('scroll',f);
  }
})();
let lastC=null,lastZ=15;
$('ymlink').onclick=()=>{const c=lastC||[37.618,55.751];window.open('https://yandex.ru/maps/?ll='+c[0]+'%2C'+c[1]+'&z='+Math.round(lastZ||15),'_blank','noopener')};
if(window.visualViewport){visualViewport.addEventListener('resize',fitSug)}
drawChips();
say('Версия 20 · ключ '+MAP_KEY.slice(0,8)+' · загрузка карты…');
window.addEventListener('error',e=>say('Ошибка: '+(e.message||'скрипт не загрузился')+' · ключ '+MAP_KEY.slice(0,8)));
setTimeout(()=>{if(!map)say('Карта не ответила за 20 секунд. Ключ '+MAP_KEY.slice(0,8)+'. ymaps3 '+(typeof ymaps3==='undefined'?'не загружен':'загружен')+'. Домен: '+location.hostname)},20000);
const s=document.createElement('script');

document.head.appendChild(s);
</script>
