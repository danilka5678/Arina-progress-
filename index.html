<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта настроения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#030812;--tx:#e8f6ff;--mut:#86b9ea;--acc:#0ECCED;--bd:rgba(14,204,237,.24);--danger:#ff7a7a;--glass:rgba(3,8,18,.72);--tile:rgba(4,55,128,.55);--cond:"Oswald","Bebas Neue","Arial Narrow","Avenir Next Condensed",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1);
--gloss:linear-gradient(145deg,rgba(14,204,237,.30),rgba(4,55,128,.62) 42%,rgba(2,7,100,.72));--cta:linear-gradient(135deg,#0ECCED,#4db8ff 55%,#0ECCED)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.4 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
#mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mut);background:radial-gradient(80% 50% at 50% 0%,rgba(2,94,196,.5),transparent 70%),var(--bg);z-index:3}
#top{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
#top>*{pointer-events:auto}
header{position:relative;overflow:hidden;display:flex;gap:6px;padding:6px;border-radius:24px;background:linear-gradient(120deg,rgba(2,7,100,.82),rgba(3,8,18,.78));border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 26px rgba(2,94,196,.45),inset 0 1px 0 rgba(255,255,255,.12)}
header::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(14,204,237,.22) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 7s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
input{flex:1;min-width:0;font:inherit;padding:10px 14px;border:1px solid var(--bd);border-radius:16px;background:transparent;color:inherit}
input::placeholder,textarea::placeholder{color:var(--mut)}
header input{border:0;position:relative;z-index:1}
button{font-family:var(--cond);font-size:16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:10px 16px;border:0;border-radius:16px;background:var(--cta);background-size:200% 100%;color:#030812;cursor:pointer;transition:transform .15s var(--ease),box-shadow .2s,opacity .2s;position:relative;z-index:1}
button:active{transform:scale(.95)}
button.ghost{background:var(--gloss);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
button:disabled{opacity:.4}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 0}
.chip{border:1px solid var(--bd);background:linear-gradient(145deg,rgba(14,204,237,.2),rgba(3,8,18,.78) 55%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:15px;box-shadow:0 0 16px rgba(2,94,196,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.chip.on{background:var(--cta);color:#030812;border-color:transparent}
.tags .chip{background:var(--gloss);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.tags .chip.on{background:var(--cta)}
#strip{max-height:0;opacity:0;overflow:hidden;transition:max-height .45s var(--ease),opacity .3s,margin .45s var(--ease)}
#strip.open{max-height:120px;opacity:1;margin-top:10px}
#moodstrip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#moodstrip::-webkit-scrollbar{display:none}
.mi{flex:0 0 auto;width:68px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:20px;background:var(--gloss);border:1px solid var(--bd);box-shadow:0 0 14px rgba(2,94,196,.4),inset 0 1px 0 rgba(255,255,255,.25);scroll-snap-align:start;color:var(--tx);text-transform:none}
.mi .e{font-size:28px;line-height:1.1}
.mi .l{font-family:var(--cond);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.mi.on{background:var(--cta);color:#030812;box-shadow:0 0 20px rgba(14,204,237,.6)}
.mpin{width:0;height:0;position:relative;transition:opacity .2s;animation:pin .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pin{from{transform:scale(0)}to{transform:scale(1)}}
.pb{position:absolute;left:-16px;top:-38px;width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5),0 0 12px rgba(14,204,237,.5);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pb::after{content:"";position:absolute;inset:-10px}
.pb .f{transform:rotate(45deg);font-size:16px;line-height:1}
.pb.sel{animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,204,237,.8),0 3px 10px rgba(0,0,0,.5)}100%{box-shadow:0 0 0 14px rgba(14,204,237,0),0 3px 10px rgba(0,0,0,.5)}}
.pb.draft{background:#030812;border:3px dashed var(--acc)}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);transform:translate(-50%,-50%);background:var(--acc);position:relative}
.dot.me::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:rgba(14,204,237,.3);animation:halo 2s infinite}
@keyframes halo{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.dot.found{background:#ff4d6d}
#info{position:fixed;left:12px;right:12px;top:calc(124px + env(safe-area-inset-top,0px));z-index:20;background:radial-gradient(80% 90% at 0% 0%,rgba(14,204,237,.32),transparent 60%),linear-gradient(160deg,#043780,#020764 70%);border:1px solid rgba(14,204,237,.32);border-radius:22px;padding:14px 44px 14px 16px;box-shadow:0 10px 34px rgba(0,0,0,.55),0 0 26px rgba(2,94,196,.45),inset 0 1px 0 rgba(255,255,255,.18);max-height:40%;overflow:auto;animation:drop .4s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
#info[hidden]{display:none}
#info h3{margin:0 0 4px;font-family:var(--cond);font-size:22px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
#info .row{font-size:14px;margin-top:4px}
#info a,.rowlink a{color:var(--acc);font-weight:600}
#info .x{position:absolute;top:8px;right:8px;width:34px;height:34px;padding:0;border-radius:50%;background:var(--gloss);color:var(--tx);font-size:20px}
#sheet{display:flex;flex-direction:column;max-height:58%;margin-top:-28px;border-radius:28px 28px 0 0;border-top:1px solid rgba(14,204,237,.34);padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));position:relative;z-index:6;transition:padding .4s var(--ease);
background:radial-gradient(70% 55% at 12% 0%,rgba(14,204,237,.40),transparent 60%),radial-gradient(70% 60% at 100% 25%,rgba(2,94,196,.62),transparent 62%),linear-gradient(180deg,#043780 0%,#020764 38%,#030812 100%);background-size:170% 170%,170% 170%,100% 100%;animation:sheen 10s ease-in-out infinite alternate;box-shadow:0 -8px 34px rgba(2,94,196,.45),inset 0 1px 0 rgba(255,255,255,.25)}
@keyframes sheen{0%{background-position:0% 0%,100% 20%,0 0}100%{background-position:100% 40%,0% 70%,0 0}}
#sheet.collapsed{padding-bottom:calc(2px + env(safe-area-inset-bottom,0px))}
#grab{padding:12px 0 14px;cursor:pointer;touch-action:none}
#grab i{display:block;width:48px;height:5px;border-radius:3px;background:linear-gradient(90deg,rgba(14,204,237,.3),rgba(14,204,237,.9),rgba(14,204,237,.3));margin:0 auto}
#sheetwrap{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--ease)}
#sheet.collapsed #sheetwrap{grid-template-rows:0fr}
#sheetbody{min-height:0;overflow:auto;transition:opacity .3s}
#sheet.collapsed #sheetbody{opacity:0;overflow:hidden}
#sheet h2{font-family:var(--cond);font-size:28px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:0 0 4px}
.hint{background:var(--gloss);color:var(--tx);padding:14px 16px;border-radius:18px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.mut{color:var(--mut);font-size:13px}
.bar{height:10px;border-radius:5px;background:rgba(14,204,237,.15);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:5px;transition:width .6s var(--ease)}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.mood{font-size:30px;line-height:1;padding:12px 0;border-radius:18px;background:var(--gloss);border:2px solid transparent;color:inherit;text-transform:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.mood.on{border-color:var(--acc);transform:scale(1.07);box-shadow:0 0 18px rgba(14,204,237,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
textarea{width:100%;margin-top:12px;font:inherit;padding:12px 14px;border:0;border-radius:16px;background:var(--gloss);color:inherit;resize:vertical;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.rev{font-size:14px;margin-top:6px;padding:8px 10px;border-radius:12px;background:var(--gloss)}
.btn{width:100%;margin-top:12px;padding:14px;border-radius:18px;font-size:19px}
.del{color:var(--danger);margin-top:8px;width:100%;background:transparent}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="mapwrap">
  <div id="map"><div id="msg">Загрузка карты…</div></div>
  <div id="top">
    <header>
      <input id="q" type="search" placeholder="Поиск адреса">
      <button id="go">Найти</button>
      <button id="loc" class="ghost" aria-label="Моё местоположение">📍</button>
    </header>
    <div class="chips" id="chips"></div>
    <div id="strip"><div id="moodstrip"></div></div>
  </div>
</div>
<div id="info" hidden></div>
<div id="sheet"><div id="grab" role="button" aria-label="Свернуть или развернуть"><i></i></div><div id="sheetwrap"><div id="sheetbody"><div class="hint">👆 Нажмите на карту или на заведение, чтобы отметить место</div></div></div></div>

<script>
const MAP_KEY = '585f43bd-1508-4be9-ab2f-0736c802dda6'; // JavaScript API
const GEO_KEY = '34c7b8b8-2ce4-49da-985b-1102ac7a5104'; // HTTP Геокодер

const MOODS=["😭","😞","😐","🙂","😊","😄","😍","🤩"];
const TAGS=["тихо","уютно","шумно","весело","суета"];
const $=id=>document.getElementById(id);
const store={
  load(){try{return JSON.parse(localStorage.getItem('moodmap_places')||'[]')}catch(e){return[]}},
  save(v){try{localStorage.setItem('moodmap_places',JSON.stringify(v))}catch(e){}}
};
let places=store.load(),map,lib,pins=new Map(),sel=null,draft=null,draftMk=null,pm=null,pt=null,filt=null,moodFilter=null,me,found,reviewText='';
places.forEach(p=>{if(!p.s){p.v=p.v.map(x=>Math.round((x-1)/4*7+1));p.s=8}if(!p.r)p.r=[]});store.save(places);

const avg=p=>p.v.length?p.v.reduce((a,b)=>a+b,0)/p.v.length:null;
const col=a=>a==null?'#9aa1ad':`hsl(${(a-1)/(MOODS.length-1)*120},70%,50%)`;
const face=a=>a==null?'•':MOODS[Math.round(a)-1];
function bestFor(tag){let b=null,m=0;places.forEach(p=>{const n=p.t[tag]||0;if(n>m){m=n;b=p.id}});return b}
function say(t){const m=$('msg');m.textContent=t;m.style.display='flex'}
function pin(cls){const o=document.createElement('div');o.className='mpin';const b=document.createElement('div');b.className='pb '+(cls||'');const f=document.createElement('span');f.className='f';b.appendChild(f);o.appendChild(b);o.pb=b;o.f=f;return o}
function dot(cls){const d=document.createElement('div');d.className='dot '+(cls||'');return d}

function passMood(p){if(moodFilter==null)return true;const a=avg(p);return a!=null&&Math.round(a)===moodFilter}
const MLAB=["ужас","плохо","так себе","норм","хорошо","класс","супер","огонь"];
function drawStrip(){
  const b=$('moodstrip');b.textContent='';
  const mk=(emo,lab,on,fn)=>{const t=document.createElement('button');t.className='mi'+(on?' on':'');const e=document.createElement('span');e.className='e';e.textContent=emo;const l=document.createElement('span');l.className='l';l.textContent=lab;t.appendChild(e);t.appendChild(l);t.onclick=fn;b.appendChild(t)};
  mk('✨','Все',moodFilter==null,()=>{moodFilter=null;drawStrip();drawChips();refreshPins()});
  MOODS.forEach((m,i)=>mk(m,MLAB[i],moodFilter===i+1,()=>{moodFilter=moodFilter===i+1?null:i+1;drawStrip();drawChips();refreshPins()}));
}
function drawChips(){
  const c=$('chips');c.textContent='';
  const all=document.createElement('button');
  all.className='chip'+(moodFilter!=null||filt==null?' on':'');
  all.textContent=(moodFilter!=null?MOODS[moodFilter-1]+' ':'')+'Все '+($('strip').classList.contains('open')?'▴':'▾');
  all.onclick=()=>{const o=$('strip').classList.toggle('open');if(o){hideInfo();drawStrip()}drawChips()};
  c.appendChild(all);
  [["Хочу тишины","тихо"],["Хочу веселья","весело"]].forEach(([l,t])=>{
    const b=document.createElement('button');b.className='chip'+(filt===t?' on':'');b.textContent=l;
    b.onclick=()=>{filt=filt===t?null:t;drawChips();refreshPins()};c.appendChild(b);
  });
}
function paint(p){
  const o=pins.get(p.id);if(!o)return;
  const a=avg(p),best=filt?bestFor(filt):null;
  o.el.pb.style.background=col(a);o.el.f.textContent=face(a);
  o.el.style.opacity=filt&&p.id!==best?0.3:1;
  o.el.style.visibility=passMood(p)?'visible':'hidden';
  o.el.pb.classList.toggle('sel',sel===p.id);
}
function refreshPins(){places.forEach(paint)}
function addMarker(p){
  const e=pin();
  e.addEventListener('click',ev=>{ev.stopPropagation();select(p.id)});
  const mk=new lib.YMapMarker({coordinates:p.c},e);
  map.addChild(mk);pins.set(p.id,{mk,el:e});paint(p);
}
function clearDraft(){hideInfo();if(draftMk){map.removeChild(draftMk);draftMk=null}draft=null}
function select(id){setCollapsed(false);
  clearDraft();sel=id;pm=null;pt=null;reviewText='';refreshPins();
  const p=places.find(x=>x.id===id);if(p)map.setLocation({center:p.c,duration:300});
  drawSheet();
}
function moodButtons(){return `<div class="moods">${MOODS.map((m,i)=>`<button class="mood${pm===i+1?' on':''}" data-m="${i+1}">${m}</button>`).join('')}</div><div class="tags">${TAGS.map(t=>`<button class="chip${pt===t?' on':''}" data-t="${t}">${t}</button>`).join('')}</div><textarea id="rv" rows="2" placeholder="Отзыв о месте"></textarea>`}
function bind(s){
  const rv=$('rv');if(rv){rv.value=reviewText;rv.oninput=()=>{reviewText=rv.value}}
  s.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{pm=pm===+b.dataset.m?null:+b.dataset.m;keepName();drawSheet()});
  s.querySelectorAll('.tags .chip').forEach(b=>b.onclick=()=>{pt=pt===b.dataset.t?null:b.dataset.t;keepName();drawSheet()});
}
let draftName='';
function keepName(){const n=$('nm');if(n)draftName=n.value}

function drawSheet(){
  const s=$('sheetbody');
  if(draft){
    s.innerHTML=`<h2>Новое место</h2><div class="mut" id="ad" style="margin-bottom:8px"></div><input id="nm" placeholder="Название"><div class="mut" style="margin-top:6px">Какая тут атмосфера?</div>${moodButtons()}<button class="btn" id="save" ${pm?'':'disabled'}>Сохранить место</button><button class="ghost del" id="cancel" style="color:var(--tx)">Отмена</button>`;
    $('nm').value=draftName;$('ad').textContent='📍 '+draftAddr;
    bind(s);
    $('cancel').onclick=()=>{clearDraft();draftName='';drawSheet()};
    $('save').onclick=()=>{
      const name=$('nm').value.trim()||draftShort||draft[1].toFixed(5)+', '+draft[0].toFixed(5);
      const p={id:String(Date.now()),c:draft,name,addr:/^(Определяю|Адрес не|Не удалось)/.test(draftAddr)?'':draftAddr,v:[pm],s:8,r:reviewText.trim()?[{m:pm,t:pt||'',x:reviewText.trim(),d:Date.now()}]:[],t:pt?{[pt]:1}:{}};
      places.push(p);store.save(places);clearDraft();draftName='';addMarker(p);select(p.id);
    };
    return;
  }
  const p=places.find(x=>x.id===sel);
  if(!p){s.innerHTML='<div class="hint">👆 Нажмите на карту или на заведение, чтобы отметить место</div>';return}
  const a=avg(p),tags=Object.entries(p.t).sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>x[0]).join(', ');
  s.innerHTML=`<h2></h2><div class="mut" id="ad2"></div><div class="mut">${a==null?'Пока нет отметок':`Сейчас ${face(a)} ${a.toFixed(1)} из ${MOODS.length} · отметок: ${p.v.length}`}</div><div class="bar"><i style="width:${a?a/MOODS.length*100:0}%;background:${col(a)}"></i></div><div class="mut">Теги: ${tags||'пока нет'}</div><div id="ymrow" class="rowlink" style="margin-top:6px"></div><div id="revs"></div>${moodButtons()}<button class="btn" id="go2" ${pm?'':'disabled'}>Отметить настроение</button><button class="ghost del" id="rm">Удалить место</button>`;
  s.querySelector('h2').textContent=p.name;$('ad2').textContent=p.addr?'📍 '+p.addr:'';
  const ya=document.createElement('a');ya.href=ymapsUrl(p.name,p.addr||'',p.c);ya.target='_blank';ya.rel='noopener';ya.textContent='🗺 Рейтинг и отзывы в Яндекс Картах';ya.style.color='var(--acc)';$('ymrow').appendChild(ya);
  (p.r||[]).slice(-5).reverse().forEach(r=>{const d=document.createElement('div');d.className='rev';d.textContent=(MOODS[r.m-1]||'')+' '+r.x+' · '+new Date(r.d).toLocaleDateString('ru-RU');$('revs').appendChild(d)});
  bind(s);
  $('go2').onclick=()=>{p.v.push(pm);if(p.v.length>30)p.v.shift();if(pt)p.t[pt]=(p.t[pt]||0)+1;if(reviewText.trim()){p.r=p.r||[];p.r.push({m:pm,t:pt||'',x:reviewText.trim(),d:Date.now()})}reviewText='';store.save(places);pm=null;pt=null;paint(p);drawSheet()};
  $('rm').onclick=()=>{map.removeChild(pins.get(p.id).mk);pins.delete(p.id);places=places.filter(x=>x.id!==p.id);store.save(places);sel=null;drawSheet()};
}

function ymapsUrl(name,addr,c){return 'https://yandex.ru/maps/?ll='+c[0]+'%2C'+c[1]+'&z=17&text='+encodeURIComponent((name||'')+(addr?', '+addr:''))}
function hideInfo(){$('info').hidden=true}
function showInfo(d){
  const b=$('info');b.textContent='';b.hidden=false;b.style.top=($('top').getBoundingClientRect().bottom+8)+'px';
  const x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label','Закрыть');x.onclick=hideInfo;b.appendChild(x);
  const h=document.createElement('h3');h.textContent=d.title||'Место';b.appendChild(h);
  const add=(t,cls)=>{if(!t)return null;const r=document.createElement('div');r.className='row '+(cls||'');r.textContent=t;b.appendChild(r);return r};
  add(d.cat);
  add(d.addr&&'📍 '+d.addr);
  add(d.hours&&'🕒 '+d.hours);
  if(d.phone){const r=add('📞 ');const a=document.createElement('a');a.textContent=d.phone;a.href='tel:'+d.phone.replace(/[^+\d]/g,'');r.appendChild(a)}
  if(d.url&&/^https?:\/\//.test(d.url)){const r=add('🌐 ');const a=document.createElement('a');a.textContent=d.url.replace(/^https?:\/\//,'').slice(0,40);a.href=d.url;a.target='_blank';a.rel='noopener';r.appendChild(a)}
  if(d.link){const r=add('🗺 ');const a=document.createElement('a');a.textContent='Рейтинг и отзывы в Яндекс Картах';a.href=d.link;a.target='_blank';a.rel='noopener';r.appendChild(a)}
  if(d.busy)add('Загружаю описание…','mut');
  if(d.src)add('Источник: '+d.src,'mut');
}
async function findOrg(c,hotName){
  if(!lib.search)return null;
  const dLat=0.0004,dLon=0.0007;
  const r=await lib.search({text:hotName||'организация',bounds:[[c[0]-dLon,c[1]-dLat],[c[0]+dLon,c[1]+dLat]],limit:10});
  const list=Array.isArray(r)?r:(r&&r.features)||[];
  let best=null,bd=1e9;
  for(const f of list){
    const g=f.geometry&&f.geometry.coordinates;if(!g)continue;
    const d=Math.hypot((g[0]-c[0])*0.57*111000,(g[1]-c[1])*111000);
    if(d<bd){bd=d;best=f}
  }
  if(!best||bd>(hotName?150:80))return null;
  const p=best.properties||{},cm=p.CompanyMetaData||{};
  const cats=(cm.Categories||p.categories||[]).map(x=>x&&x.name||x).filter(x=>typeof x==='string').slice(0,3).join(', ');
  const ph=(cm.Phones||[]).map(x=>x&&x.formatted||x).filter(x=>typeof x==='string')[0]||'';
  return{name:p.name||hotName,cat:cats,addr:p.description||'',hours:(cm.Hours&&cm.Hours.text)||'',phone:ph,url:cm.url||''};
}
async function tapPlace(c,obj){
  const hp=(obj&&obj.entity&&obj.entity.properties)||{};
  const hotName=String(hp.name||hp.title||(hp.hint&&hp.hint.title)||'');
  startDraft(c,hotName,'Определяю адрес…');
  showInfo({title:hotName||'Определяю место…',busy:true});
  const [ar,or]=await Promise.allSettled([revGeocode(c),findOrg(c,hotName)]);
  if(draft!==c)return;
  const a=ar.status==='fulfilled'?ar.value:null,o=or.status==='fulfilled'?or.value:null;
  keepName();
  draftAddr=a?a.full:'Адрес не найден, будут координаты';
  draftShort=(o&&o.name)||hotName||(a&&a.short)||'';
  if(!draftName.trim()||draftName===hotName)draftName=draftShort;
  drawSheet();
  if(o)showInfo({title:o.name,cat:o.cat,addr:(a&&a.full)||o.addr,hours:o.hours,phone:o.phone,url:o.url,link:ymapsUrl(o.name,(a&&a.full)||o.addr,c),src:'поиск Яндекса'});
  else showInfo({title:hotName||(a&&a.short)||'Место на карте',addr:a&&a.full,link:ymapsUrl(hotName||(a&&a.short)||'',a?a.full:'',c),src:hotName?'название с карты (описание не найдено)':'адрес (организацию рядом найти не удалось)'});
}
let draftAddr='',draftShort='';
function startDraft(c,name,addr){setCollapsed(false);
  sel=null;refreshPins();clearDraft();pm=null;pt=null;reviewText='';
  draft=c;draftName=name||'';draftShort=name||'';draftAddr=addr||'Определяю адрес…';
  draftMk=new lib.YMapMarker({coordinates:c},pin('draft'));map.addChild(draftMk);
  drawSheet();
  if(addr)return;
  revGeocode(c).then(r=>{
    if(draft!==c)return;
    keepName();
    if(r){draftAddr=r.full;draftShort=r.short;if(!draftName.trim())draftName=r.short}
    else draftAddr='Адрес не найден, будут координаты';
    drawSheet();
  }).catch(()=>{if(draft!==c)return;keepName();draftAddr='Не удалось определить адрес';drawSheet()});
}
async function revGeocode(c){
  for(const kind of ['house','street','locality']){
    const url='https://geocode-maps.yandex.ru/v1/?format=json&results=1&lang=ru_RU&sco=longlat&kind='+kind+'&apikey='+encodeURIComponent(GEO_KEY)+'&geocode='+c[0]+','+c[1];
    const r=await fetch(url);
    if(!r.ok)throw new Error('geo '+r.status);
    const j=await r.json(),m=j.response.GeoObjectCollection.featureMember[0];
    if(m){const g=m.GeoObject;return{full:g.metaDataProperty.GeocoderMetaData.text,short:g.name}}
  }
  return null;
}
async function geocode(text){
  const url='https://geocode-maps.yandex.ru/v1/?format=json&results=1&lang=ru_RU&apikey='+encodeURIComponent(GEO_KEY)+'&geocode='+encodeURIComponent(text);
  const r=await fetch(url);
  if(!r.ok)throw new Error('Геокодер вернул ошибку '+r.status+'. Проверьте, что в ключе включён HTTP Геокодер.');
  const j=await r.json(),m=j.response.GeoObjectCollection.featureMember[0];
  if(!m)return null;
  const [lon,lat]=m.GeoObject.Point.pos.split(' ').map(Number);
  return {c:[lon,lat],name:m.GeoObject.metaDataProperty.GeocoderMetaData.text};
}
async function search(){
  const t=$('q').value.trim();if(!t)return;
  try{
    const r=await geocode(t);
    if(!r)return alert('Ничего не найдено. Уточните адрес.');
    map.setLocation({center:r.c,zoom:16,duration:400});
    if(found)map.removeChild(found);
    found=new lib.YMapMarker({coordinates:r.c},dot('found'));map.addChild(found);
    startDraft(r.c,r.name,r.name);
  }catch(e){alert(e.message)}
}
function locate(){
  if(!navigator.geolocation)return alert('Геолокация недоступна в этом браузере.');
  navigator.geolocation.getCurrentPosition(pos=>{
    const c=[pos.coords.longitude,pos.coords.latitude];
    setMe(c);
    map.setLocation({center:c,zoom:15,duration:400});
  },()=>alert('Не удалось определить местоположение. Разрешите доступ в настройках браузера.'));
}

function getPos(){return new Promise(res=>{
  if(!navigator.geolocation)return res(null);
  let done=false;const fin=v=>{if(!done){done=true;res(v)}};
  setTimeout(()=>fin(null),7000);
  navigator.geolocation.getCurrentPosition(p=>fin([p.coords.longitude,p.coords.latitude]),()=>fin(null),{enableHighAccuracy:true,timeout:7000,maximumAge:60000});
})}
function setMe(c){
  if(me)map.removeChild(me);
  me=new lib.YMapMarker({coordinates:c},dot('me'));map.addChild(me);
  try{localStorage.setItem('moodmap_last',JSON.stringify(c))}catch(e){}
}
function styleOpenBtn(){
  const LAB='Открыть Яндекс Карты';
  const fix=()=>{
    const root=$('map');
    const leaf=[...root.querySelectorAll('*')].find(n=>!n.children.length&&n.textContent.trim()===LAB&&!n.dataset.fixed);
    if(!leaf)return;
    leaf.dataset.fixed='1';leaf.style.display='none';
    let n=leaf.parentElement,box=null;
    for(let k=0;k<5&&n&&n!==root;k++,n=n.parentElement){
      const bg=getComputedStyle(n).backgroundColor;
      if(bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent'){box=n;break}
    }
    if(box){
      box.title=LAB;box.setAttribute('aria-label',LAB);
      Object.assign(box.style,{background:'linear-gradient(145deg,rgba(14,204,237,.35),rgba(3,8,18,.85))',border:'1px solid rgba(14,204,237,.4)',borderRadius:'50%',width:'38px',height:'38px',minWidth:'38px',padding:'0',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 14px rgba(2,94,196,.6)'});
    }
  };
  new MutationObserver(fix).observe($('map'),{childList:true,subtree:true});
  fix();
}
async function init(){
  await ymaps3.ready;lib=ymaps3;
  const {YMap,YMapDefaultSchemeLayer,YMapDefaultFeaturesLayer,YMapListener}=lib;
  say('Определяю, где вы находитесь…');
  const pos=await getPos();
  let last=null;try{last=JSON.parse(localStorage.getItem('moodmap_last')||'null')}catch(e){}
  const start=pos||last||(places.length?places[0].c:[37.618,55.751]);
  $('msg').style.display='none';
  const loc0={center:start,zoom:(pos||last||places.length)?15:10};
  try{map=new YMap($('map'),{location:loc0,margin:[0,0,28,0]})}catch(e){map=new YMap($('map'),{location:loc0})}
  const dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  map.addChild(new YMapDefaultSchemeLayer({theme:'dark'}));
  map.addChild(new YMapDefaultFeaturesLayer());
  if(pos)setMe(pos);
  styleOpenBtn();
  map.addChild(new YMapListener({layer:'any',onClick:(obj,ev)=>{if(obj&&obj.type==='marker')return;if(ev&&ev.coordinates)tapPlace(ev.coordinates,obj)}}));
  places.forEach(addMarker);
}

$('go').onclick=search;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('loc').onclick=()=>map?locate():null;
function setCollapsed(v){$('sheet').classList.toggle('collapsed',v)}
$('grab').onclick=()=>setCollapsed(!$('sheet').classList.contains('collapsed'));
function swipe(el,needTop){
  let y0=null;
  el.addEventListener('touchstart',e=>{y0=(needTop&&el.scrollTop>0)?null:e.touches[0].clientY},{passive:true});
  el.addEventListener('touchend',e=>{if(y0==null)return;const d=e.changedTouches[0].clientY-y0;y0=null;if(Math.abs(d)>30){setCollapsed(d>0);if(!needTop)e.preventDefault()}});
}
swipe($('grab'),false);swipe($('sheetbody'),true);
drawChips();
say('Версия 9 · ключ '+MAP_KEY.slice(0,8)+' · загрузка карты…');
window.addEventListener('error',e=>say('Ошибка: '+(e.message||'скрипт не загрузился')+' · ключ '+MAP_KEY.slice(0,8)));
setTimeout(()=>{if(!map)say('Карта не ответила за 20 секунд. Ключ '+MAP_KEY.slice(0,8)+'. ymaps3 '+(typeof ymaps3==='undefined'?'не загружен':'загружен')+'. Домен: '+location.hostname)},20000);
const s=document.createElement('script');
s.src='https://api-maps.yandex.ru/v3/?apikey='+encodeURIComponent(MAP_KEY)+'&lang=ru_RU';
s.onload=()=>init().catch(e=>say('Ошибка карты: '+e.message));
s.onerror=()=>say('Не удалось загрузить Яндекс Карты. Проверьте интернет и ключ.');
document.head.appendChild(s);
</script>
